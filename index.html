<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Nihongo 10 — Японский за 10 минут</title><style>
:root{--bg:#f7f8fc;--card:#fff;--text:#151923;--muted:#6b7280;--accent:#ef4444;--accent2:#111827;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Noto Sans,sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;cursor:pointer}.app{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;font-size:24px}.brand span{color:var(--accent)}.pill{background:#111827;color:white;border-radius:999px;padding:8px 12px;font-size:13px}.hero{background:linear-gradient(135deg,#111827,#2d3748);color:white;border-radius:24px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#d1d5db}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px #00000008}.level{display:flex;justify-content:space-between;align-items:center}.level b{font-size:24px}.progress{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--accent);width:0}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--accent2);color:#fff;font-weight:700}.btn.red{background:var(--accent)}.btn.light{background:#eef0f4;color:#111827}.btn:disabled{opacity:.45;cursor:not-allowed}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0}.nav button{white-space:nowrap}.screen{display:none}.screen.active{display:block}.lesson{max-width:760px;margin:auto}.timer{text-align:center;font-size:46px;font-weight:900;margin:15px}.jp{font-size:48px;font-weight:900;text-align:center;margin:18px}.trans{text-align:center;color:var(--muted);font-size:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.choice{padding:16px;border:2px solid var(--line);border-radius:14px;background:white;text-align:left}.choice.correct{border-color:var(--ok);background:#f0fdf4}.choice.wrong{border-color:var(--bad);background:#fef2f2}.feedback{min-height:28px;margin-top:14px;font-weight:700}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.small{font-size:13px;color:var(--muted)}.dialogue{background:#f1f5f9;border-radius:16px;padding:15px;margin:12px 0}.bubble{padding:10px 13px;border-radius:15px;background:white;margin:8px 0;max-width:85%}.bubble.me{margin-left:auto;background:#111827;color:white}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;display:none}.muted{color:var(--muted)}
</style></head><body><div class="app"><div class="top"><div class="brand">Nihongo <span>10</span> 🇯🇵</div><div class="pill" id="streak">🔥 0 дней</div></div>
<div class="nav"><button class="btn" onclick="show('home')">Главная</button><button class="btn light" onclick="show('dictionary')">Словарь</button><button class="btn light" onclick="show('tests')">Тесты</button><button class="btn light" onclick="show('stats')">Прогресс</button></div>
<section id="home" class="screen active"><div class="hero"><h1>Японский за 10 минут</h1><p>Один короткий урок каждый день. От あいうえお до N1.</p></div><div class="grid" id="levels"></div><div class="card" style="margin-top:12px"><div class="level"><div><div class="small">Сегодня</div><h2 id="todayTitle" style="margin:3px 0">Урок 1 — Хирагана</h2><div class="muted">≈ 10 минут</div></div><button class="btn red" onclick="startLesson()">Начать</button></div></div></section>
<section id="lesson" class="screen"><div class="lesson"><div class="card"><div class="small" id="lessonMeta">N5 · Урок 1</div><div class="timer" id="timer">10:00</div><div class="progress"><div class="bar" id="lessonBar"></div></div><div id="exercise"></div></div></div></section>
<section id="dictionary" class="screen"><div class="card"><h2>📚 Словарь</h2><input class="search" id="search" placeholder="Поиск: слово или перевод" oninput="renderDict()"><div class="list" id="dict"></div></div></section>
<section id="tests" class="screen"><div class="card"><h2>📝 Тесты уровней</h2><p class="muted">Итоговый тест открывается по мере прохождения курса.</p><div class="grid" id="testCards"></div></div></section>
<section id="stats" class="screen"><div class="card"><h2>📊 Прогресс</h2><div id="statsBox"></div></div></section>
</div><div class="toast" id="toast"></div>
<script>
const vocab=[
['あいさつ','あいさつ','приветствие','N5'],['ありがとう','ありがとう','спасибо','N5'],['こんにちは','こんにちは','здравствуйте','N5'],['おはよう','おはよう','доброе утро','N5'],['さようなら','さようなら','до свидания','N5'],['これ','これ','это','N5'],['本','ほん','книга','N5'],['水','みず','вода','N5'],['人','ひと','человек','N5'],['学校','がっこう','школа','N5'],['先生','せんせい','учитель','N5'],['友達','ともだち','друг','N5'],['食べる','たべる','есть','N5'],['飲む','のむ','пить','N5'],['見る','みる','смотреть','N5'],['行く','いく','идти','N5'],['来る','くる','приходить','N5'],['大きい','おおきい','большой','N5'],['小さい','ちいさい','маленький','N5'],['好き','すき','нравиться','N5'],['駅','えき','станция','N4'],['電車','でんしゃ','поезд','N4'],['病院','びょういん','больница','N4'],['仕事','しごと','работа','N4'],['経験','けいけん','опыт','N4'],['必要','ひつよう','необходимость','N4'],['理由','りゆう','причина','N4'],['準備','じゅんび','подготовка','N4'],['説明','せつめい','объяснение','N4'],['約束','やくそく','обещание/договорённость','N3'],['状況','じょうきょう','ситуация','N3'],['影響','えいきょう','влияние','N3'],['結果','けっか','результат','N3'],['可能性','かのうせい','возможность','N3'],['判断','はんだん','решение/суждение','N3'],['環境','かんきょう','окружающая среда','N3'],['責任','せきにん','ответственность','N2'],['課題','かだい','задача/проблема','N2'],['制度','せいど','система/制度','N2'],['交渉','こうしょう','переговоры','N2'],['適切','てきせつ','надлежащий','N2'],['認識','にんしき','осознание/понимание','N2'],['概念','がいねん','концепция','N1'],['妥当','だとう','обоснованный/надлежащий','N1'],['曖昧','あいまい','неоднозначный','N1'],['考慮','こうりょ','учёт/рассмотрение','N1'],['促進','そくしん','содействие/ускорение','N1']];
const levels=[['N5','С нуля','Кана, базовые слова и фразы'],['N4','База','Повседневное общение'],['N3','Средний','Контекст и сложные предложения'],['N2','Продвинутый','Формальная речь и тексты'],['N1','Высший','Нюансы, идиомы и подтекст']];
const lessons={N5:['Хирагана','Приветствия','Числа и время','Семья','Еда','Дом','Транспорт','Базовая грамматика','Первые диалоги','Итог N5'],N4:['Повседневная речь','て-form','Покупки','Поездка','Работа','Врач','Опыт и причины','Планы','Диалоги','Итог N4'],N3:['Контекст','Предположение','Новости','Общество','Абстрактная лексика','Причина и следствие','Длинные предложения','Аудирование','Диалог','Итог N3'],N2:['Формальная речь','Работа','Деловые письма','Документы','Переговоры','Статьи','Нюансы','Сложное аудирование','Дискуссия','Итог N2'],N1:['Идиомы','Публицистика','Академический стиль','Подтекст','Синонимы','Нюансы частиц','Сложные тексты','Естественная речь','Анализ','Итог N1']};
let state=JSON.parse(localStorage.nihongo10||'{"level":"N5","lesson":0,"done":0,"streak":0,"last":""}');
function save(){localStorage.nihongo10=JSON.stringify(state);document.getElementById('streak').textContent='🔥 '+state.streak+' дней'}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='dictionary')renderDict();if(id==='tests')renderTests();if(id==='stats')renderStats()}
function renderHome(){document.getElementById('levels').innerHTML=levels.map((l,i)=>{let pct=i<levelIndex()?100:i===levelIndex()?Math.min(100,Math.round(state.lesson/10*100)):0;return `<div class="card"><div class="level"><b>${l[0]}</b><span>${pct}%</span></div><div class="small">${l[1]}</div><p class="muted">${l[2]}</p><div class="progress"><div class="bar" style="width:${pct}%"></div></div></div>`}).join('');document.getElementById('todayTitle').textContent='Урок '+(state.lesson+1)+' — '+lessons[state.level][state.lesson%10]}
function levelIndex(){return ['N5','N4','N3','N2','N1'].indexOf(state.level)}
let questions=[
{jp:'これ',ru:'это',opts:['это','книга','вода','человек']},{jp:'水',ru:'вода',opts:['школа','вода','учитель','друг']},{jp:'先生',ru:'учитель',opts:['учитель','поезд','станция','работа']},{jp:'食べる',ru:'есть',opts:['пить','смотреть','идти','есть']},{jp:'大きい',ru:'большой',opts:['маленький','новый','большой','старый']},{jp:'友達',ru:'друг',opts:['семья','друг','время','город']}];
let q=0,score=0,lessonStart=0,timerId;
function startLesson(){q=0;score=0;lessonStart=Date.now();show('lesson');speak('こんにちは');renderQ();clearInterval(timerId);timerId=setInterval(updateTimer,1000)}
function updateTimer(){let sec=Math.floor((Date.now()-lessonStart)/1000);document.getElementById('timer').textContent=Math.max(0,600-sec);let m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s;document.getElementById('lessonBar').style.width=Math.min(100,sec/6)+'%';if(sec>=600)finishLesson()}
function renderQ(){let x=questions[q%questions.length];document.getElementById('lessonMeta').textContent=state.level+' · '+lessons[state.level][state.lesson%10]+' · '+(q+1)+'/6';document.getElementById('exercise').innerHTML=`<div class="jp">${x.jp}</div><div class="trans">Выбери перевод</div><div class="choices">${x.opts.map(o=>`<button class="choice" onclick="answer(this,'${o.replaceAll("'","\\'")}','${x.ru}')">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><div style="text-align:center;margin-top:15px"><button class="btn light" onclick="speak('${x.jp}')">🔊 Слушать</button></div>`}
function answer(btn,val,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);let ok=val===correct;btn.classList.add(ok?'correct':'wrong');document.getElementById('fb').textContent=ok?'✓ Правильно!':'✗ Правильный ответ: '+correct;if(ok)score++;setTimeout(()=>{q++;if(q<6)renderQ();else finishLesson()},900)}
function finishLesson(){clearInterval(timerId);state.done++;state.lesson++;let today=new Date().toISOString().slice(0,10);if(state.last!==today){state.streak++;state.last=today}if(state.lesson>=10&&state.level!=='N1'){let idx=levelIndex();state.level=['N5','N4','N3','N2','N1'][idx+1];state.lesson=0;toast('Уровень открыт: '+state.level+' 🎉')}save();renderHome();show('home');toast('Урок завершён! Результат: '+score+'/6')}
function speak(t){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.8;speechSynthesis.speak(u)}else toast('Озвучивание не поддерживается браузером')}
function renderDict(){let s=(document.getElementById('search')?.value||'').toLowerCase();let a=vocab.filter(x=>x.join(' ').toLowerCase().includes(s));document.getElementById('dict').innerHTML=a.map(x=>`<div class="row"><div><b>${x[0]}</b> <span class="small">${x[1]}</span><div class="small">${x[2]} · ${x[3]}</div></div><button class="btn light" onclick="speak('${x[0]}')">🔊</button></div>`).join('')||'<p class="muted">Ничего не найдено.</p>'}
function renderTests(){document.getElementById('testCards').innerHTML=levels.map((l,i)=>`<div class="card"><div class="level"><b>${l[0]}</b><span>${i<=levelIndex()?'🔓':'🔒'}</span></div><p>${l[2]}</p><button class="btn ${i<=levelIndex()?'':'light'}" ${i<=levelIndex()?'':'disabled'} onclick="startTest('${l[0]}')">Пройти тест</button></div>`).join('')}
function startTest(l){toast('Демо-тест '+l+': после прохождения курса здесь будет полноценный экзамен из 20–50 заданий.');}
function renderStats(){let total=state.done;document.getElementById('statsBox').innerHTML=`<div class="grid"><div><div class="small">Уроков завершено</div><h2>${total}</h2></div><div><div class="small">Текущий уровень</div><h2>${state.level}</h2></div><div><div class="small">Серия дней</div><h2>🔥 ${state.streak}</h2></div></div><hr><p>Прогресс уровня: ${Math.min(100,Math.round(state.lesson/10*100))}%</p><div class="progress"><div class="bar" style="width:${Math.min(100,state.lesson*10)}%"></div></div>`}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}
save();renderHome();
</script></body></html>
